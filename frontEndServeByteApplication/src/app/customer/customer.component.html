
<div class="col-md-6 offset-md-3">
  <h3> Register As Customer </h3>
  <form (ngSubmit) = "onSubmit()">

      <div class="form-group">
          <label> First Name</label>
          <input type="text" class ="form-control" id = "firstName"
              [(ngModel)] = "customer.first_name" name = "firstName">
      </div>

      <div class="form-group">
          <label> Last Name</label>
          <input type="text" class ="form-control" id = "lastName"
              [(ngModel)] = "customer.last_name" name = "lastName">
      </div>

      <div class="form-group">
          <label> Email </label>
          <input type="text" class ="form-control" id = "email"
              [(ngModel)] = "customer.email" name = "email">
      </div>

      <div class="form-group">
        <label> PhoneNumber</label>
        <input type="text" class ="form-control" id = "phoneNumber"
            [(ngModel)] = "customer.phone_number" name = "phoneNumber">
    </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" class ="form-control" id = "Address"
            [(ngModel)] = "customer.address" name = "address">
    </div>

      <button class = "btn btn-success" type ="submit">Submit</button>

  </form>
  </div>
