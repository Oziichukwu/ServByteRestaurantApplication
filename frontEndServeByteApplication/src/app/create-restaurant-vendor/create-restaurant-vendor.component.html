 <div class="container-fluid">
    <div class="row">
        <div class="md-col-12 text-center bg-warning">
          <h2>Register As A Food Vendor</h2>
        </div>
    </div>

    <div class="container">
      <form [formGroup]="form" (ngSubmit)="submitForm()">

        <div class="progress form-group" *ngIf="progress > 0">
          <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" aria-valuemin = "0" aria-valuemax = "100" role="progressbar" [style.width]="progress + '%' ">

          </div>
        </div><br><br>

        <div class="form-group input-group-lg">
          <label>Name</label>
          <input class="form-control" placeholder="name" formControlName="name">
        </div><br>

        <div class="form-group input-group-lg">
          <label>Email</label>
          <input class="form-control" placeholder="email" formControlName="email">
        </div><br>

        <div class="form-group input-group-lg">
          <label>PhoneNumber</label>
          <input class="form-control" placeholder="phoneNumber" formControlName="phoneNumber">
        </div><br>

        <div class="form-group input-group-lg">
          <div> <label>Choose City</label></div>
          <!-- <input class="form-control" placeholder="city" formControlName="city"> -->
              <select name="" id="" style="width: 100%; height:45px; border: 1px solid #ccc ; border-radius: 5px">
                <option>LAGOS</option>
                <option>ABUJA</option>
                <option>BAYELSA</option>
                <option>IBADAN</option>
                <option>ABA</option>
                <option>UYO</option>
                <option>PORTHARCOURT</option>
                <option>ENUGU</option>
                <option>ONITSHA</option>
                <option>OWERRI</option>
                <option>KANO</option>
                <option>ASABA</option>
            </select>

        </div><br>

        <div class="form-group">
         <div> <label>Upload your logo</label></div>
          <input type="file" (change)="uploadFile($event)">
        </div><br>

        <div class="form-group">
          <button class="btn btn-success btn-block btn-lg btn-block">Submit Form</button>
        </div>

      </form>
    </div>

 </div>
